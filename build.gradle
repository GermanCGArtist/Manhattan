plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    // baritone-api-fabric-<version>.jar lives in ./libs
    flatDir { dirs 'libs' }
}

dependencies {
    // MC 26.1+ is unobfuscated: no mappings, plain implementation instead of modImplementation
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // baritone-api-fabric-<version>.jar from https://github.com/cabaletta/baritone/releases
    implementation name: "baritone-api-fabric-${project.baritone_version}"
}

// The test bridge for tests/ingame: its own jar (build/libs/manhattan-testbridge-<version>.jar), only ever
// installed into the "Manhatten Testing" profile. Same package as the mod, so it can start scripts directly.
sourceSets {
    ingame {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
processIngameResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}
tasks.register('testBridgeJar', Jar) {
    group = 'build'
    description = 'Builds the test-only bridge mod for tests/ingame.'
    archiveBaseName = 'manhattan-testbridge'
    from sourceSets.ingame.output
}
tasks.named('assemble') { dependsOn 'testBridgeJar' }

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:unchecked']   // (Mojang marks hasChunkAt / blocksMotion deprecated as "internal"; vanilla uses them too)
}

// Offline checks, no Minecraft needed: the language tests (src/test) and a parse check of every script in scripts/.
// Both run with "build" (via check); on their own: gradlew langTest / gradlew parseScripts
tasks.register('langTest', JavaExec) {
    group = 'verification'
    description = 'Runs the script language through the real parser and interpreter.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.baritonequeue.LangTest'
}
tasks.register('parseScripts', JavaExec) {
    group = 'verification'
    description = 'Checks that every scripts/*.txt parses.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.baritonequeue.ParseFile'
    def scripts = fileTree('scripts') { include '*.txt' }
    inputs.files scripts
    argumentProviders.add({ scripts.files.collect { it.absolutePath } } as CommandLineArgumentProvider)
}
tasks.named('check') { dependsOn 'langTest', 'parseScripts' }
tasks.named('test') { failOnNoDiscoveredTests = false }   // the tests above are plain programs, not JUnit

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
